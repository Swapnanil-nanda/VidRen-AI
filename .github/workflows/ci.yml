name: VidRen AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm install

      - name: Build @vidren/dsl Package
        run: npm run build --workspace=packages/vidren-dsl || true

      - name: Build @vidren/rag-engine Package
        run: npm run build --workspace=packages/rag-engine || true

      - name: Typecheck Next.js Front-End
        run: npm run build --workspace=apps/web

      - name: Execute Ingestion Worker Self-Test
        run: node services/worker-ingestion/dist/ingestionWorker.js
